name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit

      - name: Smoke Test
        run: npm test
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      # Temporary PR-only probe; remove before merge.
      - name: Verify v0.0.61 retry package matches npm
        if: github.head_ref == 'codex/retry-release-publication'
        run: |
          npm version patch --no-git-tag-version
          REMOTE=$(npm view @cablate/mcp-google-map@0.0.61 dist.integrity --json | jq -r '.')
          LOCAL=$(npm pack --dry-run --json | jq -r '.[0].integrity')
          test "$REMOTE" = "$LOCAL"

  node18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
