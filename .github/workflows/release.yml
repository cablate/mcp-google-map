name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    # Skip automated version bump commits and stale push events for an already tagged main.
    if: "!contains(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.unreleased.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether main is already released
        id: unreleased
        run: |
          git fetch origin main --tags
          if git describe --tags --exact-match --match 'v[0-9]*' origin/main >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Current main already has a version tag; no release needed"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm run lint

      - name: E2E Tests
        run: npm run test:e2e
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Sync latest from main (pick up previous release commits)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase

      - name: Bump version
        run: npm version patch --no-git-tag-version

      - name: Update CHANGELOG
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          # Collect commit messages since last tag
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges | grep -v "^- chore: release")
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges -10 | grep -v "^- chore: release")
          fi

          # Prepend new version to CHANGELOG.md
          HEADER="## ${VERSION}"
          TMPFILE=$(mktemp)
          echo "# Changelog" > "$TMPFILE"
          echo "" >> "$TMPFILE"
          echo "$HEADER" >> "$TMPFILE"
          echo "" >> "$TMPFILE"
          echo "$COMMITS" >> "$TMPFILE"
          echo "" >> "$TMPFILE"
          # Append existing content (skip the first "# Changelog" line)
          tail -n +2 CHANGELOG.md >> "$TMPFILE"
          mv "$TMPFILE" CHANGELOG.md

      - name: Publish to npm
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${PACKAGE}@${VERSION}" version --json >/dev/null 2>&1; then
            # npm may have accepted a previous attempt before the registry or
            # version tag succeeded. Resume only if the packed bytes are identical.
            PUBLISHED_INTEGRITY=$(npm view "${PACKAGE}@${VERSION}" dist.integrity --json | jq -r '.')
            LOCAL_INTEGRITY=$(npm pack --dry-run --json | jq -r '.[0].integrity')
            if [ "$PUBLISHED_INTEGRITY" != "$LOCAL_INTEGRITY" ]; then
              echo "${PACKAGE}@${VERSION} already exists with different package contents" >&2
              exit 1
            fi
            echo "${PACKAGE}@${VERSION} was already published with identical contents"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Sync server.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish to MCP Registry
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SERVER_NAME=$(jq -r '.name' server.json)
          ENCODED_SERVER_NAME=${SERVER_NAME//\//%2F}
          REGISTRY_RESPONSE="$RUNNER_TEMP/mcp-registry-version.json"
          STATUS=$(curl -sS --retry 3 -o "$REGISTRY_RESPONSE" -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${ENCODED_SERVER_NAME}/versions/${VERSION}")
          if [ "$STATUS" = 200 ]; then
            # The registry omits optional false fields; compare after normalizing them.
            if ! jq -e -s '
              def strip_false: walk(if type == "object" then with_entries(select(.value != false)) else . end);
              (.[0].server | strip_false) == (.[1] | strip_false)
            ' "$REGISTRY_RESPONSE" server.json >/dev/null; then
              echo "MCP Registry already has a different ${SERVER_NAME}@${VERSION}" >&2
              exit 1
            fi
            echo "${SERVER_NAME}@${VERSION} was already published to MCP Registry"
            exit 0
          fi
          if [ "$STATUS" != 404 ]; then
            echo "Could not check MCP Registry version: HTTP ${STATUS}" >&2
            exit 1
          fi

          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          for attempt in {1..30}; do
            if ./mcp-publisher publish; then
              exit 0
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "MCP Registry publish failed after $attempt attempts"
              exit 1
            fi

            echo "MCP Registry has not observed the npm release yet; retrying in 20 seconds"
            sleep 20
          done

      - name: Commit version bump & tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json CHANGELOG.md server.json
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git pull --rebase
          git push
          git push --tags

      - name: Create GitHub Release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log ${PREV_TAG}..v${VERSION} --pretty=format:"- %s" --no-merges | grep -v "^- chore: release")
          else
            NOTES="Initial release"
          fi
          gh release create "v${VERSION}" --title "v${VERSION}" --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release Docker images
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh workflow run docker.yml --ref main
          gh workflow run docker.yml --ref "v${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
